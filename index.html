<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Minecraft 1v1 Arena Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Minecraft UI Styling */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 16px; height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.8);
        }
        #crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
        #crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }

        #boss-ui {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            width: 320px; text-align: center;
            pointer-events: none;
        }
        #boss-name {
            color: #fff; font-weight: bold; font-size: 16px;
            text-shadow: 2px 2px #000; margin-bottom: 4px;
        }
        #boss-bar-bg {
            width: 100%; height: 16px; background: #222;
            border: 2px solid #000; box-shadow: inset 0 0 5px #000;
        }
        #boss-bar-fill {
            width: 100%; height: 100%; background: #c08;
            transition: width 0.1s linear;
        }

        #instructions {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.6);
            padding: 8px 16px; border-radius: 4px;
            font-size: 14px; text-align: center;
        }
    </style>
    <!-- Three.js Engine & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="boss-ui">
        <div id="boss-name">Ender Dragon</div>
        <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
    </div>
    <div id="instructions">Click on screen to Lock Mouse & Play (WASD = Walk, Space = Jump, Left Click = Attack)</div>
    <div id="canvas-container"></div>

    <script>
        // ----------------------------------------------------------------------
        // 1. PROCEDURAL PIXEL-ART TEXTURE GENERATORS (Minecraft Style)
        // ----------------------------------------------------------------------
        function createPixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');

            if (type === 'grass_top') {
                ctx.fillStyle = '#55a135'; ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 30; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#488c2c' : '#61b33c';
                    ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
                }
            } else if (type === 'dirt') {
                ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#573d2a' : '#9c7352';
                    ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
                }
            } else if (type === 'stone') {
                ctx.fillStyle = '#737373'; ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#525252' : '#8a8a8a';
                    ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Sharp pixelated filter
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const grassTopTex = createPixelTexture('grass_top');
        const dirtTex = createPixelTexture('dirt');
        const stoneTex = createPixelTexture('stone');

        // Block Materials
        const grassBlockMaterials = [
            new THREE.MeshLambertMaterial({ map: dirtTex }), // Right
            new THREE.MeshLambertMaterial({ map: dirtTex }), // Left
            new THREE.MeshLambertMaterial({ map: grassTopTex }), // Top
            new THREE.MeshLambertMaterial({ map: dirtTex }), // Bottom
            new THREE.MeshLambertMaterial({ map: dirtTex }), // Front
            new THREE.MeshLambertMaterial({ map: dirtTex })  // Back
        ];
        const stoneMaterial = new THREE.MeshLambertMaterial({ map: stoneTex });

        // ----------------------------------------------------------------------
        // 2. SCENE SETUP & LIGHTING
        // ----------------------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee); // Sky Blue
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Ambient & Directional Sunlight Shadows
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // ----------------------------------------------------------------------
        // 3. GENERATE DRDONUT 1v1 ARENA (Grass Floor + Stone Walls)
        // ----------------------------------------------------------------------
        const ARENA_SIZE = 20;
        const WALL_HEIGHT = 4;
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        for (let x = 0; x < ARENA_SIZE; x++) {
            for (let z = 0; z < ARENA_SIZE; z++) {
                // Grass Floor
                const block = new THREE.Mesh(boxGeo, grassBlockMaterials);
                block.position.set(x, 0, z);
                block.receiveShadow = true;
                block.castShadow = true;
                scene.add(block);
                blocks.push(block);
            }
        }

        // Surrounding Stone Walls
        for (let y = 1; y <= WALL_HEIGHT; y++) {
            for (let i = 0; i < ARENA_SIZE; i++) {
                const wallPositions = [
                    [i, y, -1], [i, y, ARENA_SIZE],
                    [-1, y, i], [ARENA_SIZE, y, i]
                ];
                wallPositions.forEach(pos => {
                    const wallBlock = new THREE.Mesh(boxGeo, stoneMaterial);
                    wallBlock.position.set(pos[0], pos[1], pos[2]);
                    wallBlock.receiveShadow = true;
                    wallBlock.castShadow = true;
                    scene.add(wallBlock);
                    blocks.push(wallBlock);
                });
            }
        }

        // ----------------------------------------------------------------------
        // 4. ENDER DRAGON BOSS
        // ----------------------------------------------------------------------
        const dragonGroup = new THREE.Group();
        const dragonMat = new THREE.MeshLambertMaterial({ color: 0x221122 }); // Dark Magenta Body
        
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 3), dragonMat);
        bodyMesh.castShadow = true;
        dragonGroup.add(bodyMesh);

        // Dragon Wings
        const wingMat = new THREE.MeshLambertMaterial({ color: 0x110511 });
        const leftWing = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1.5), wingMat);
        leftWing.position.set(-2.5, 0, 0);
        const rightWing = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1.5), wingMat);
        rightWing.position.set(2.5, 0, 0);
        dragonGroup.add(leftWing); dragonGroup.add(rightWing);

        dragonGroup.position.set(ARENA_SIZE / 2, 6, ARENA_SIZE / 2);
        scene.add(dragonGroup);

        let bossMaxHP = 200, bossCurrentHP = 200;

        function damageBoss(amount) {
            bossCurrentHP -= amount;
            const percentage = Math.max(0, (bossCurrentHP / bossMaxHP) * 100);
            document.getElementById('boss-bar-fill').style.width = percentage + '%';
            if (bossCurrentHP <= 0) {
                scene.remove(dragonGroup);
                document.getElementById('boss-name').innerText = "Ender Dragon Defeated!";
            }
        }

        // ----------------------------------------------------------------------
        // 5. PLAYER CONTROLS & PHYSICS
        // ----------------------------------------------------------------------
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        camera.position.set(ARENA_SIZE / 2, 2, ARENA_SIZE / 2);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3(), canJump = false;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) { velocity.y += 8; canJump = false; }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // Raycast Attack
        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && controls.isLocked) { // Left Click
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects([bodyMesh, leftWing, rightWing]);
                if (intersects.length > 0) {
                    damageBoss(25);
                }
            }
        });

        // ----------------------------------------------------------------------
        // 6. MAIN GAME LOOP
        // ----------------------------------------------------------------------
        let prevTime = performance.now();
        let dragonAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Movement Decay
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.0 * delta; // Gravity

                const direction = new THREE.Vector3();
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += velocity.y * delta;

                if (camera.position.y < 2) {
                    velocity.y = 0;
                    camera.position.y = 2;
                    canJump = true;
                }
            }

            // Ender Dragon Flying AI
            if (bossCurrentHP > 0) {
                dragonAngle += delta * 1.5;
                const radius = 6;
                dragonGroup.position.x = (ARENA_SIZE / 2) + Math.cos(dragonAngle) * radius;
                dragonGroup.position.z = (ARENA_SIZE / 2) + Math.sin(dragonAngle) * radius;
                dragonGroup.position.y = 5 + Math.sin(dragonAngle * 2);
                dragonGroup.rotation.y = -dragonAngle;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
