<!DOCTYPE html>
<html lang="haw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahua Pāʻani Nui - Arena 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); }
        #crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
        #crosshair::after { left: 0; top: 7px; width: 16px; height: 2px; }
        #blocker { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 10; cursor: pointer; }
        #instructions { text-align: center; padding: 20px; background: rgba(0, 0, 0, 0.8); border: 2px solid #fff; border-radius: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="crosshair"></div>
        <div id="blocker">
            <div id="instructions">
                <h1>Kahua Pāʻani Nui (Arena)</h1>
                <p>Kāpō i ka pae e pāʻani ai / E neʻe me WASD a me ka 'Mouse'</p>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        let prevTime = performance.now();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x68a0ff); // Lani hōʻikeʻike
            scene.fog = new THREE.FogExp2(0x68a0ff, 0.008);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Mālamalama
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('game-container').appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            blocker.addEventListener('click', () => { controls.lock(); });
            controls.addEventListener('lock', () => blocker.style.display = 'none');
            controls.addEventListener('unlock', () => blocker.style.display = 'flex');

            scene.add(controls.getObject());
            controls.getObject().position.set(0, 3, 0); // Kū ma ka waena o ke kahua

            buildColosseumArena();
            setupControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function buildColosseumArena() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            
            // Nā mea hana pōhaku like ʻole
            const sandMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.9 }); // Pukano kahua
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 0.8 }); // Pōhaku
            const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x404040, roughness: 0.8 }); // Pōhaku pō darkness
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.5 }); // Pou keʻokeʻo
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 }); // Kaupoku
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.6 }); // Lau nahele

            const radius = 35; // Ke kalaiwa o ke kahua nui
            const instancedMeshGroup = new THREE.Group();

            // 1. Honua One (Sand Arena Floor)
            for (let x = -radius; x <= radius; x++) {
                for (let z = -radius; z <= radius; z++) {
                    if (x * x + z * z <= radius * radius) {
                        const sand = new THREE.Mesh(boxGeo, sandMat);
                        sand.position.set(x, 0, z);
                        scene.add(sand);
                    }
                }
            }

            // 2. Ka pā pōhaku poepoe a me nā noho (Circular Arena Walls & Seating)
            const segments = 64;
            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                // Nā pahi pōhaku pōʻai mua (Lower Ring Base)
                for (let h = 1; h <= 4; h++) {
                    const blockRadius = radius + 1;
                    const wallBlock = new THREE.Mesh(boxGeo, darkStoneMat);
                    wallBlock.position.set(cos * blockRadius, h, sin * blockRadius);
                    wallBlock.lookAt(0, h, 0);
                    scene.add(wallBlock);
                }

                // Nā tier noho pōhaku (Tiered Bleachers)
                for (let tier = 0; tier < 8; tier++) {
                    const currentRadius = radius + 2 + (tier * 1.5);
                    const tierHeight = 4 + (tier * 1.2);
                    
                    const seatBlock = new THREE.Mesh(boxGeo, stoneMat);
                    seatBlock.position.set(cos * currentRadius, tierHeight, sin * currentRadius);
                    seatBlock.scale.set(1.5, 1.2, 1.5);
                    seatBlock.lookAt(0, tierHeight, 0);
                    scene.add(seatBlock);
                }

                // 3. Nā Pou Keʻokeʻo (Pillars & Arches)
                if (i % 3 === 0) {
                    const pillarRadius = radius + 14;
                    const pillarBaseHeight = 14;
                    
                    // Pou
                    for (let ph = 0; ph < 8; ph++) {
                        const pillar = new THREE.Mesh(boxGeo, pillarMat);
                        pillar.position.set(cos * pillarRadius, pillarBaseHeight + ph, sin * pillarRadius);
                        pillar.scale.set(1.2, 1, 1.2);
                        scene.add(pillar);
                    }

                    // Nā meakanu no ke kāhiko (Bush Decor)
                    const bush = new THREE.Mesh(boxGeo, leafMat);
                    bush.position.set(cos * (pillarRadius - 2), 14, sin * (pillarRadius - 2));
                    bush.scale.set(1.2, 1.5, 1.2);
                    scene.add(bush);
                }

                // 4. Kaupoku Pōhaku ʻUlaʻula ma luna loa (Top Roof Rim)
                const topRadius = radius + 15;
                const topHeight = 23;
                const roofBlock = new THREE.Mesh(boxGeo, woodMat);
                roofBlock.position.set(cos * topRadius, topHeight, sin * topRadius);
                roofBlock.scale.set(2, 1, 2);
                scene.add(roofBlock);
            }
        }

        function setupControls() {
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            });
            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                const dirZ = Number(moveForward) - Number(moveBackward);
                const dirX = Number(moveRight) - Number(moveLeft);
                if (moveForward || moveBackward) velocity.z -= dirZ * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= dirX * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
