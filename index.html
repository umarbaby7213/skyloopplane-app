<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Arena - 1v1 PvP</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            background-color: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* HUD & UI Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 10px;
        }

        /* Boss Bar */
        #boss-bar-container {
            margin-top: 15px;
            text-align: center;
        }

        #boss-name {
            color: #d35400;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px #000;
            margin-bottom: 5px;
        }

        #boss-bar-bg {
            width: 300px;
            height: 14px;
            background: #2c3e50;
            border: 2px solid #000;
            border-radius: 2px;
            overflow: hidden;
        }

        #boss-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #e74c3c, #c0392b);
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        #crosshair::before {
            left: 7px;
            top: 0;
            width: 2px;
            height: 16px;
        }

        #crosshair::after {
            left: 0;
            top: 7px;
            width: 16px;
            height: 2px;
        }

        /* Hotbar & Status Bars */
        #bottom-hud {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status-bars {
            display: flex;
            justify-content: space-between;
            width: 360px;
            margin-bottom: 6px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }

        #hotbar {
            display: flex;
            background: rgba(0, 0, 0, 0.5);
            border: 4px solid #333;
            border-radius: 4px;
        }

        .hotbar-slot {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            margin: 2px;
            background: rgba(250, 250, 250, 0.15);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 11px;
            text-shadow: 1px 1px #000;
        }

        .hotbar-slot.active {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.3);
        }

        /* Instructions Screen */
        #blocker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            cursor: pointer;
            z-index: 10;
        }

        #instructions {
            font-size: 20px;
        }
    </style>

    <!-- Import Three.js Engine & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <p style="font-size:36px">CLICK TO PLAY</p>
            <p>
                Move: WASD<br/>
                Jump: SPACE<br/>
                Look: MOUSE<br/>
                Switch Item: Keys 1 - 4
            </p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="boss-bar-container">
            <div id="boss-name">Ender Dragon</div>
            <div id="boss-bar-bg">
                <div id="boss-bar-fill"></div>
            </div>
        </div>

        <div id="crosshair"></div>

        <div id="bottom-hud">
            <div id="status-bars">
                <span>❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️</span>
                <span>🍗🍗🍗🍗🍗🍗🍗🍗🍗🍗</span>
            </div>
            <div id="hotbar">
                <div class="hotbar-slot active" id="slot-1">Sword</div>
                <div class="hotbar-slot" id="slot-2">Crystal</div>
                <div class="hotbar-slot" id="slot-3">Totem</div>
                <div class="hotbar-slot" id="slot-4">Blocks</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. GAME SETUP ---
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // --- 2. TEXTURE GENERATOR (Procedural Pixel Art) ---
        function createPixelTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');

            if (type === 'grass') {
                ctx.fillStyle = '#5b8731';
                ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 30; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#4c7228' : '#6ba037';
                    ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
                }
            } else if (type === 'dirt') {
                ctx.fillStyle = '#866043';
                ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#573d2a' : '#9c7352';
                    ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
                }
            } else if (type === 'stone') {
                ctx.fillStyle = '#737373';
                ctx.fillRect(0, 0, 16, 16);
                for (let i = 0; i < 40; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#525252' : '#8a8a8a';
                    ctx.fillRect(Math.floor(Math.random() * 16), Math.floor(Math.random() * 16), 1, 1);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter; // Preserve Minecraft pixelation
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // --- 3. INIT SCENE ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff); // Sky blue
            scene.fog = new THREE.Fog(0x78a7ff, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);

            const blocker = document.getElementById('blocker');
            blocker.addEventListener('click', () => {
                controls.lock();
            });

            controls.addEventListener('lock', () => {
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', () => {
                blocker.style.display = 'flex';
            });

            scene.add(controls.getObject());

            // Keybindings
            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': if (canJump === true) velocity.y += 12; canJump = false; break;
                    case 'Digit1': selectSlot(1); break;
                    case 'Digit2': selectSlot(2); break;
                    case 'Digit3': selectSlot(3); break;
                    case 'Digit4': selectSlot(4); break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Generate Arena Voxels
            buildArena();

            // Create Player Held Sword Model
            createDiamondSword();

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            window.addEventListener('resize', onWindowResize);
        }

        // --- 4. BUILD WORLD BLOCK ARENA ---
        function buildArena() {
            const grassTex = createPixelTexture('grass');
            const dirtTex = createPixelTexture('dirt');
            const stoneTex = createPixelTexture('stone');

            const grassMat = new THREE.MeshLambertMaterial({ map: grassTex });
            const dirtMat = new THREE.MeshLambertMaterial({ map: dirtTex });
            const stoneMat = new THREE.MeshLambertMaterial({ map: stoneTex });

            const boxGeo = new THREE.BoxGeometry(1, 1, 1);

            // Construct floor platform (30x30 blocks)
            for (let x = -15; x < 15; x++) {
                for (let z = -15; z < 15; z++) {
                    // Top grass block
                    const block = new THREE.Mesh(boxGeo, grassMat);
                    block.position.set(x, 0, z);
                    scene.add(block);

                    // Dirt block underneath
                    const subBlock = new THREE.Mesh(boxGeo, dirtMat);
                    subBlock.position.set(x, -1, z);
                    scene.add(subBlock);
                }
            }

            // Outer Arena Wall
            for (let i = -15; i <= 15; i++) {
                for (let y = 1; y <= 3; y++) {
                    let w1 = new THREE.Mesh(boxGeo, stoneMat);
                    w1.position.set(i, y, -15);
                    scene.add(w1);

                    let w2 = new THREE.Mesh(boxGeo, stoneMat);
                    w2.position.set(i, y, 15);
                    scene.add(w2);

                    let w3 = new THREE.Mesh(boxGeo, stoneMat);
                    w3.position.set(-15, y, i);
                    scene.add(w3);

                    let w4 = new THREE.Mesh(boxGeo, stoneMat);
                    w4.position.set(15, y, i);
                    scene.add(w4);
                }
            }
        }

        // --- 5. 3D DIAMOND SWORD MODEL ---
        let swordGroup;
        function createDiamondSword() {
            swordGroup = new THREE.Group();

            const cyanMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const brownMat = new THREE.MeshBasicMaterial({ color: 0x5c4033 });
            const pixelGeo = new THREE.BoxGeometry(0.04, 0.04, 0.04);

            // Blade
            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(pixelGeo, cyanMat);
                p.position.set(i * 0.03, i * 0.03, 0);
                swordGroup.add(p);
            }

            // Hilt & Handle
            const handle = new THREE.Mesh(pixelGeo, brownMat);
            handle.position.set(-0.03, -0.03, 0);
            swordGroup.add(handle);

            // Position relative to player camera view
            swordGroup.position.set(0.3, -0.3, -0.5);
            swordGroup.rotation.y = -Math.PI / 4;
            swordGroup.rotation.z = Math.PI / 6;

            camera.add(swordGroup);
        }

        function selectSlot(slotNum) {
            document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('active'));
            document.getElementById(`slot-${slotNum}`).classList.add('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 30.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                controls.getObject().position.y += (velocity.y * delta);

                // Floor Collision Check
                if (controls.getObject().position.y < 1.8) {
                    velocity.y = 0;
                    controls.getObject().position.y = 1.8;
                    canJump = true;
                }

                // Subtle Sword Idle Motion
                if (swordGroup) {
                    swordGroup.position.y = -0.3 + Math.sin(time * 0.005) * 0.01;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
