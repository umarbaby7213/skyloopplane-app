<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 3D Voxel Arena</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      user-select: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      margin-left: -5px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }
    #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
    #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      text-shadow: 1px 1px 2px black;
      font-size: 14px;
    }
    #instructions {
      position: absolute;
      top: 50%;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 24px;
      text-shadow: 2px 2px 4px black;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="crosshair"></div>
  <div id="ui">
    <b>Controls:</b> WASD = Move | SPACE = Jump | Left Click = Break | Right Click = Place
  </div>
  <div id="instructions">Click Anywhere to Play</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene & Renderer Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // World Building
    const blockSize = 1;
    const arenaSize = 16;
    const blocks = new Map();
    const boxGeo = new THREE.BoxGeometry(blockSize, blockSize, blockSize);

    const grassMat = new THREE.MeshLambertMaterial({ color: 0x557a2b });
    const wallMat = new THREE.MeshLambertMaterial({ color: 0x777777 });

    function getPosKey(x, y, z) {
      return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
    }

    function addBlock(x, y, z, material) {
      const mesh = new THREE.Mesh(boxGeo, material);
      mesh.position.set(x, y, z);
      scene.add(mesh);
      blocks.set(getPosKey(x, y, z), mesh);
    }

    // Generate Arena Floor & Walls
    for (let x = -arenaSize; x <= arenaSize; x++) {
      for (let z = -arenaSize; z <= arenaSize; z++) {
        addBlock(x, 0, z, grassMat);
        if (Math.abs(x) === arenaSize || Math.abs(z) === arenaSize) {
          for (let y = 1; y <= 4; y++) {
            addBlock(x, y, z, wallMat);
          }
        }
      }
    }

    // Player Physics & Controls
    const player = {
      pos: new THREE.Vector3(0, 2, 0),
      vel: new THREE.Vector3(),
      onGround: false,
      speed: 0.12,
      gravity: -0.008,
      jump: 0.18
    };

    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Pointer Lock Camera Controls
    const instructions = document.getElementById('instructions');
    let isLocked = false;

    instructions.addEventListener('click', () => {
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      isLocked = document.pointerLockElement === document.body;
      instructions.style.display = isLocked ? 'none' : 'block';
    });

    let yaw = 0, pitch = 0;
    document.addEventListener('mousemove', e => {
      if (!isLocked) return;
      yaw -= e.movementX * 0.002;
      pitch -= e.movementY * 0.002;
      pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
    });

    // Raycasting for Block Placement & Breaking
    const raycaster = new THREE.Raycaster();
    const mouseCenter = new THREE.Vector2(0, 0);

    window.addEventListener('mousedown', e => {
      if (!isLocked) return;
      raycaster.setFromCamera(mouseCenter, camera);
      const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

      if (intersects.length > 0) {
        const hit = intersects[0];
        if (e.button === 0) { // Left Click: Break Block
          scene.remove(hit.object);
          for (let [key, val] of blocks.entries()) {
            if (val === hit.object) {
              blocks.delete(key);
              break;
            }
          }
        } else if (e.button === 2) { // Right Click: Place Block
          const p = hit.point.clone().add(hit.face.normal.clone().multiplyScalar(0.5));
          const nx = Math.round(p.x);
          const ny = Math.round(p.y);
          const nz = Math.round(p.z);
          if (!blocks.has(getPosKey(nx, ny, nz))) {
            addBlock(nx, ny, nz, grassMat);
          }
        }
      }
    });

    document.addEventListener('contextmenu', e => e.preventDefault());

    // Game Loop
    function animate() {
      requestAnimationFrame(animate);

      if (isLocked) {
        // Rotation
        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Movement Vectors
        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        let moveX = 0, moveZ = 0;
        if (keys['KeyW']) { moveX += forward.x; moveZ += forward.z; }
        if (keys['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
        if (keys['KeyD']) { moveX += side.x; moveZ += side.z; }
        if (keys['KeyA']) { moveX -= side.x; moveZ -= side.z; }

        player.pos.x += moveX * player.speed;
        player.pos.z += moveZ * player.speed;

        // Gravity & Ground Collision
        player.vel.y += player.gravity;
        player.pos.y += player.vel.y;

        if (player.pos.y <= 1.8) {
          player.pos.y = 1.8;
          player.vel.y = 0;
          player.onGround = true;
        }

        if (keys['Space'] && player.onGround) {
          player.vel.y = player.jump;
          player.onGround = false;
        }

        camera.position.copy(player.pos);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
