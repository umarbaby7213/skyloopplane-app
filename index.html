<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Donut SMP - Steve Crystal PvP (Mobile & AI)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        #game-view { display: flex; width: 100vw; height: 100vh; position: relative; }
        .player-viewport { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        .split-screen .player-viewport { width: 50vw; border-right: 2px solid #222; }

        /* Crosshair */
        .crosshair { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 2px #000; }
        .crosshair::before { left: 7px; top: 0; width: 2px; height: 16px; }
        .crosshair::after { left: 0; top: 7px; width: 16px; height: 2px; }

        /* HUD Overlays */
        .hud { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5; }
        .player-tag { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px; border-radius: 4px; font-weight: bold; border: 2px solid #555; z-index: 5; }

        .status-wrapper { display: flex; justify-content: space-between; width: 100%; margin-bottom: 6px; gap: 10px; }
        .hearts-bar { display: flex; gap: 2px; background: rgba(0, 0, 0, 0.6); padding: 4px 8px; border-radius: 4px; border: 2px solid #3c3c3c; }
        .heart-wrapper { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }

        .pixel-heart {
            width: 8px; height: 8px; image-rendering: pixelated;
            box-shadow: 
                2px 0px 0 #000, 3px 0px 0 #000, 6px 0px 0 #000, 7px 0px 0 #000,
                1px 1px 0 #000, 2px 1px 0 #e02424, 3px 1px 0 #ff6b6b, 4px 1px 0 #000, 5px 1px 0 #000, 6px 1px 0 #e02424, 7px 1px 0 #e02424, 8px 1px 0 #000,
                0px 2px 0 #000, 1px 2px 0 #ffffff, 2px 2px 0 #ff6b6b, 3px 2px 0 #e02424, 4px 2px 0 #e02424, 5px 2px 0 #e02424, 6px 2px 0 #e02424, 7px 2px 0 #9c0000, 8px 2px 0 #000,
                0px 3px 0 #000, 1px 3px 0 #ff6b6b, 2px 3px 0 #e02424, 3px 3px 0 #e02424, 4px 3px 0 #e02424, 5px 3px 0 #e02424, 6px 3px 0 #e02424, 7px 3px 0 #9c0000, 8px 3px 0 #000,
                0px 4px 0 #000, 1px 4px 0 #e02424, 2px 4px 0 #e02424, 3px 4px 0 #e02424, 4px 4px 0 #e02424, 5px 4px 0 #e02424, 6px 4px 0 #e02424, 7px 4px 0 #9c0000, 8px 4px 0 #000,
                1px 5px 0 #000, 2px 5px 0 #e02424, 3px 5px 0 #e02424, 4px 5px 0 #e02424, 5px 5px 0 #e02424, 6px 5px 0 #9c0000, 7px 5px 0 #000,
                2px 6px 0 #000, 3px 6px 0 #e02424, 4px 6px 0 #e02424, 5px 6px 0 #9c0000, 6px 6px 0 #000,
                3px 7px 0 #000, 4px 7px 0 #e02424, 5px 7px 0 #000, 4px 8px 0 #000;
            transform: scale(1.6); transition: opacity 0.2s;
        }
        .pixel-heart.empty { opacity: 0.2; }

        .hotbar { display: flex; background: rgba(0, 0, 0, 0.7); border: 3px solid #3c3c3c; border-radius: 4px; pointer-events: auto; }
        .slot { width: 44px; height: 44px; border: 2px solid #8b8b8b; background: rgba(139, 139, 139, 0.3); margin: 2px; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 18px; position: relative; cursor: pointer; }
        .slot.active { border-color: #ffffff; background: rgba(255, 255, 255, 0.4); box-shadow: inset 0 0 6px #fff; }
        .count-badge { position: absolute; bottom: 2px; right: 3px; font-size: 10px; color: #fff; text-shadow: 1px 1px #000; }

        /* Mobile Controls UI */
        .mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; display: none; }
        .touch-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 60px; pointer-events: auto; }
        .touch-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 25px; }
        
        .action-btns { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        .btn-touch { width: 60px; height: 60px; background: rgba(0,0,0,0.6); border: 2px solid #fff; border-radius: 30px; color: #fff; font-weight: bold; font-size: 14px; display: flex; justify-content: center; align-items: center; }
        .btn-touch:active { background: rgba(255,255,255,0.4); }

        /* Start Overlay */
        #blocker { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; z-index: 10; }
        #instructions { text-align: center; padding: 25px; background: rgba(20, 20, 20, 0.95); border: 3px solid #00aaff; box-shadow: 0 0 30px #00aaff; border-radius: 8px; max-width: 550px; width: 90%; }
        .mode-btn { background: #00aaff; color: #fff; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; margin: 10px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .mode-btn:hover { background: #0088cc; transform: scale(1.05); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>
    <div id="game-view">
        <!-- Player Viewport -->
        <div class="player-viewport" id="p1-viewport">
            <div class="player-tag" id="p1-tag" style="color: #55ffff;">Player 1 (Steve)</div>
            <div class="crosshair"></div>
            <div class="hud">
                <div class="status-wrapper">
                    <div class="hearts-bar" id="p1-hearts"></div>
                </div>
                <div class="hotbar">
                    <div class="slot active" onclick="selectSlot(player1, 1)" id="p1-slot-1">🗡️</div>
                    <div class="slot" onclick="selectSlot(player1, 2)" id="p1-slot-2">🍏<span class="count-badge" id="p1-gapple">64</span></div>
                    <div class="slot" onclick="selectSlot(player1, 3)" id="p1-slot-3">🔮<span class="count-badge" id="p1-crystal">64</span></div>
                    <div class="slot" onclick="selectSlot(player1, 4)" id="p1-slot-4">⬛<span class="count-badge" id="p1-obsidian">64</span></div>
                    <div class="slot" onclick="selectSlot(player1, 5)" id="p1-slot-5">🗿<span class="count-badge" id="p1-totem">1</span></div>
                </div>
            </div>

            <!-- Mobile Overlay Controls -->
            <div class="mobile-controls" id="mobile-ui">
                <div class="touch-zone" id="joystick-zone"><div class="touch-knob" id="joystick-knob"></div></div>
                <div class="action-btns">
                    <div class="btn-touch" id="btn-jump">JUMP</div>
                    <div class="btn-touch" id="btn-attack" style="border-color:#ff3333;">HIT</div>
                    <div class="btn-touch" id="btn-use" style="border-color:#55ffff;">USE</div>
                </div>
            </div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="blocker">
            <div id="instructions">
                <h1 style="color:#00aaff; margin-bottom:10px;">DONUT SMP - STEVE CRYSTAL PVP</h1>
                <p style="color:#ffaa00; font-size:14px; margin-bottom:15px; font-weight:bold;">Smooth Physics • Mobile & Keyboard • Steve Skin</p>
                
                <div>
                    <button class="mode-btn" onclick="startGame(false)">1 PLAYER VS AI BOT</button>
                    <button class="mode-btn" style="background:#ff0055;" onclick="startGame(true)">2 PLAYER SPLIT-SCREEN</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, renderer, controlsP1, isMultiplayer = false, isMobile = false;
        let p1Camera, p2Camera;

        const placeableObjects = [];

        // Player States
        const player1 = {
            id: 1, health: 10, maxHealth: 10, position: new THREE.Vector3(-5, 2, 0), velocity: new THREE.Vector3(),
            mesh: null, slot: 1, counts: { gapple: 64, crystal: 64, obsidian: 64, totem: 1 },
            keys: { fwd: false, bwd: false, left: false, right: false }
        };

        const opponent = {
            id: 2, isAI: true, health: 10, maxHealth: 10, position: new THREE.Vector3(5, 2, 0), velocity: new THREE.Vector3(),
            mesh: null, slot: 1, counts: { gapple: 64, crystal: 64, obsidian: 64, totem: 1 },
            keys: { fwd: false, bwd: false, left: false, right: false }
        };

        let prevTime = performance.now();

        function init() {
            // Detect Mobile
            isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (isMobile) document.getElementById('mobile-ui').style.display = 'block';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x6eb1ff);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const sun = new THREE.DirectionalLight(0xfff5ea, 0.9);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            p1Camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('game-view').appendChild(renderer.domElement);

            controlsP1 = new THREE.PointerLockControls(p1Camera, document.body);

            createArena();
            buildHeartsUI('p1-hearts');
            setupInputListeners();
            setupTouchEvents();

            window.addEventListener('resize', onWindowResize);
        }

        // Procedural Steve Character Generator
        function createSteveMesh(shirtColor = 0x00aaff) {
            const steveGroup = new THREE.Group();

            // Materials
            const skinMat = new THREE.MeshStandardMaterial({ color: 0xdbac82 });
            const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x052166 });
            const hairMat = new THREE.MeshStandardMaterial({ color: 0x4a2810 });

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), skinMat);
            head.position.y = 1.4;
            steveGroup.add(head);

            // Hair
            const hair = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.15, 0.52), hairMat);
            hair.position.y = 1.6;
            steveGroup.add(hair);

            // Body
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.75, 0.25), shirtMat);
            body.position.y = 0.775;
            steveGroup.add(body);

            // Legs
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.75, 0.25), pantsMat);
            leftLeg.position.set(-0.13, 0.025, 0);
            steveGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.75, 0.25), pantsMat);
            rightLeg.position.set(0.13, 0.025, 0);
            steveGroup.add(rightLeg);

            return steveGroup;
        }

        function createArena() {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            const sandMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c });
            const obsMat = new THREE.MeshStandardMaterial({ color: 0x1a0d2b });

            // Ground Floor
            for (let x = -15; x <= 15; x++) {
                for (let z = -15; z <= 15; z++) {
                    const block = new THREE.Mesh(boxGeo, sandMat);
                    block.position.set(x, 0, z);
                    scene.add(block);
                    placeableObjects.push(block);
                }
            }

            // Central Obsidian Pillar
            for (let y = 1; y <= 3; y++) {
                const obs = new THREE.Mesh(boxGeo, obsMat);
                obs.position.set(0, y, 0);
                scene.add(obs);
                placeableObjects.push(obs);
            }
        }

        function buildHeartsUI(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const wrap = document.createElement('div');
                wrap.className = 'heart-wrapper';
                wrap.innerHTML = '<div class="pixel-heart"></div>';
                container.appendChild(wrap);
            }
        }

        function updateHeartsDisplay(p) {
            const container = document.getElementById('p1-hearts');
            const hearts = container.getElementsByClassName('pixel-heart');
            for (let i = 0; i < 10; i++) {
                if (i < p.health) hearts[i].classList.remove('empty');
                else hearts[i].classList.add('empty');
            }
        }

        function startGame(multiplayer) {
            isMultiplayer = multiplayer;
            document.getElementById('blocker').style.display = 'none';

            // Create Steve Meshes
            player1.mesh = createSteveMesh(0x00aaff);
            opponent.mesh = createSteveMesh(0xff3333);
            scene.add(player1.mesh);
            scene.add(opponent.mesh);

            if (!isMobile) controlsP1.lock();

            prevTime = performance.now();
            animate();
        }

        function setupInputListeners() {
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') player1.keys.fwd = true;
                if (e.code === 'KeyS') player1.keys.bwd = true;
                if (e.code === 'KeyA') player1.keys.left = true;
                if (e.code === 'KeyD') player1.keys.right = true;
                if (e.code === 'Space' && player1.position.y <= 2.1) player1.velocity.y += 9;

                if (['Digit1','Digit2','Digit3','Digit4','Digit5'].includes(e.code)) {
                    selectSlot(player1, parseInt(e.code.replace('Digit','')));
                }
            });

            document.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') player1.keys.fwd = false;
                if (e.code === 'KeyS') player1.keys.bwd = false;
                if (e.code === 'KeyA') player1.keys.left = false;
                if (e.code === 'KeyD') player1.keys.right = false;
            });

            document.addEventListener('mousedown', (e) => {
                if (!controlsP1.isLocked && !isMobile) return;
                if (e.button === 0) performAction(player1, 'attack');
                if (e.button === 2) performAction(player1, 'use');
            });
        }

        function setupTouchEvents() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let touchId = null;

            zone.addEventListener('touchstart', (e) => {
                const t = e.changedTouches[0];
                touchId = t.identifier;
            });

            zone.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        const rect = zone.getBoundingClientRect();
                        const x = t.clientX - rect.left - 60;
                        const y = t.clientY - rect.top - 60;
                        const dist = Math.min(Math.hypot(x, y), 40);
                        const angle = Math.atan2(y, x);

                        knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;

                        player1.keys.fwd = y < -15;
                        player1.keys.bwd = y > 15;
                        player1.keys.left = x < -15;
                        player1.keys.right = x > 15;
                    }
                }
            });

            const resetJoystick = () => {
                knob.style.transform = 'translate(0px, 0px)';
                player1.keys.fwd = player1.keys.bwd = player1.keys.left = player1.keys.right = false;
            };

            zone.addEventListener('touchend', resetJoystick);
            zone.addEventListener('touchcancel', resetJoystick);

            document.getElementById('btn-jump').addEventListener('touchstart', () => {
                if (player1.position.y <= 2.1) player1.velocity.y += 9;
            });
            document.getElementById('btn-attack').addEventListener('touchstart', () => performAction(player1, 'attack'));
            document.getElementById('btn-use').addEventListener('touchstart', () => performAction(player1, 'use'));
        }

        function selectSlot(p, slotNum) {
            p.slot = slotNum;
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById(`p1-slot-${i}`);
                if (i === slotNum) el.classList.add('active');
                else el.classList.remove('active');
            }
        }

        function performAction(p, type) {
            if (type === 'use' && p.slot === 2 && p.counts.gapple > 0) {
                p.health = Math.min(p.maxHealth, p.health + 4);
                p.counts.gapple--;
                document.getElementById('p1-gapple').innerText = p.counts.gapple;
                updateHeartsDisplay(p);
            }
        }

        function updateAIBot(delta) {
            if (!opponent.isAI) return;

            // AI Logic: Chase Player 1
            const dir = new THREE.Vector3().subVectors(player1.position, opponent.position);
            dir.y = 0; dir.normalize();

            opponent.position.addScaledVector(dir, 3.5 * delta);
            opponent.mesh.lookAt(player1.position.x, opponent.position.y, player1.position.z);

            // AI Gapple when health is low
            if (opponent.health < 5 && opponent.counts.gapple > 0 && Math.random() < 0.02) {
                opponent.health = Math.min(opponent.maxHealth, opponent.health + 4);
                opponent.counts.gapple--;
            }
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            p1Camera.aspect = window.innerWidth / window.innerHeight;
            p1Camera.updateProjectionMatrix();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            // Player 1 Movement & Friction
            player1.velocity.x -= player1.velocity.x * 10.0 * delta;
            player1.velocity.z -= player1.velocity.z * 10.0 * delta;
            player1.velocity.y -= 9.8 * 22.0 * delta;

            const fwd = Number(player1.keys.fwd) - Number(player1.keys.bwd);
            const side = Number(player1.keys.right) - Number(player1.keys.left);

            if (fwd || side) {
                player1.velocity.z -= fwd * 35.0 * delta;
                player1.velocity.x -= side * 35.0 * delta;
            }

            player1.position.x += player1.velocity.x * delta;
            player1.position.z += player1.velocity.z * delta;
            player1.position.y += player1.velocity.y * delta;

            if (player1.position.y < 2.0) {
                player1.velocity.y = 0;
                player1.position.y = 2.0;
            }

            if (player1.mesh) player1.mesh.position.copy(player1.position);

            // AI Opponent Logic
            updateAIBot(delta);
            if (opponent.mesh) opponent.mesh.position.copy(opponent.position);

            // Smooth Camera Follow
            p1Camera.position.copy(player1.position);

            renderer.render(scene, p1Camera);
            prevTime = time;
        }

        window.onload = init;
    </script>
</body>
</html>
