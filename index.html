<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D Sandbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
            box-shadow: 0 0 2px black;
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #555;
            z-index: 10;
        }
        .slot {
            width: 44px;
            height: 44px;
            border: 2px solid #888;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            font-size: 12px;
        }
        .slot.active {
            border-color: #ffcc00;
            box-shadow: 0 0 8px #ffcc00;
            background: rgba(255, 204, 0, 0.2);
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            cursor: pointer;
        }
        #overlay h1 { font-size: 3rem; margin-bottom: 10px; }
        #overlay p { font-size: 1.2rem; color: #ccc; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">1: Grass</div>
        <div class="slot" id="slot-2">2: Dirt</div>
        <div class="slot" id="slot-3">3: Stone</div>
        <div class="slot" id="slot-4">4: Wood</div>
        <div class="slot" id="slot-5">5: Leaves</div>
    </div>

    <div id="overlay">
        <h1>CLICK TO PLAY</h1>
        <p>WASD to Move | Space to Jump | Left-Click: Mine | Right-Click: Place</p>
    </div>

    <script>
        // --- 1. Procedural Texture Generator ---
        function createBlockTexture(colorHex, noiseAmount = 30) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, 16, 16);

            for (let x = 0; x < 16; x++) {
                for (let y = 0; y < 16; y++) {
                    const noise = (Math.random() - 0.5) * noiseAmount;
                    ctx.fillStyle = `rgba(0,0,0,${Math.abs(noise)/255})`;
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const textures = {
            grassTop: createBlockTexture('#5b8731', 40),
            grassSide: createBlockTexture('#795548', 30),
            dirt: createBlockTexture('#5d4037', 35),
            stone: createBlockTexture('#757575', 50),
            wood: createBlockTexture('#3e2723', 40),
            leaves: createBlockTexture('#2e7d32', 60)
        };

        const materials = {
            grass: [
                new THREE.MeshLambertMaterial({ map: textures.grassSide }),
                new THREE.MeshLambertMaterial({ map: textures.grassSide }),
                new THREE.MeshLambertMaterial({ map: textures.grassTop }),
                new THREE.MeshLambertMaterial({ map: textures.dirt }),
                new THREE.MeshLambertMaterial({ map: textures.grassSide }),
                new THREE.MeshLambertMaterial({ map: textures.grassSide })
            ],
            dirt: new THREE.MeshLambertMaterial({ map: textures.dirt }),
            stone: new THREE.MeshLambertMaterial({ map: textures.stone }),
            wood: new THREE.MeshLambertMaterial({ map: textures.wood }),
            leaves: new THREE.MeshLambertMaterial({ map: textures.leaves, transparent: true, opacity: 0.9 })
        };

        // --- 2. Scene & Renderer Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Controls & Pointer Lock
        const controls = new THREE.PointerLockControls(camera, document.body);
        const overlay = document.getElementById('overlay');

        overlay.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => overlay.style.display = 'none');
        controls.addEventListener('unlock', () => overlay.style.display = 'flex');

        // --- 3. World Storage & Generation ---
        const worldBlocks = new Map();
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        function getKey(x, y, z) {
            return `${Math.floor(x)},${Math.floor(y)},${Math.floor(z)}`;
        }

        function addBlock(x, y, z, type) {
            const key = getKey(x, y, z);
            if (worldBlocks.has(key)) return;

            const mat = materials[type] || materials.dirt;
            const mesh = new THREE.Mesh(blockGeometry, mat);
            mesh.position.set(Math.floor(x) + 0.5, Math.floor(y) + 0.5, Math.floor(z) + 0.5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { key, type };

            scene.add(mesh);
            worldBlocks.set(key, mesh);
        }

        function removeBlock(mesh) {
            if (!mesh) return;
            scene.remove(mesh);
            worldBlocks.delete(mesh.userData.key);
        }

        // Generate Procedural Landscape (16x16 Area)
        const size = 16;
        for (let x = -size; x < size; x++) {
            for (let z = -size; z < size; z++) {
                const height = Math.floor(Math.sin(x * 0.2) * 2 + Math.cos(z * 0.2) * 2);
                
                // Grass Top
                addBlock(x, height, z, 'grass');
                
                // Dirt Sub-layer
                for (let y = height - 1; y >= height - 2; y--) {
                    addBlock(x, y, z, 'dirt');
                }
                
                // Stone Bedrock Layer
                for (let y = height - 3; y >= height - 4; y--) {
                    addBlock(x, y, z, 'stone');
                }

                // Random Trees
                if (Math.random() < 0.015 && x > -size + 2 && x < size - 2 && z > -size + 2 && z < size - 2) {
                    for (let th = 1; th <= 4; th++) {
                        addBlock(x, height + th, z, 'wood');
                    }
                    for (let lx = -1; lx <= 1; lx++) {
                        for (let lz = -1; lz <= 1; lz++) {
                            for (let ly = 4; ly <= 5; ly++) {
                                if (lx === 0 && lz === 0 && ly === 4) continue;
                                addBlock(x + lx, height + ly, z + lz, 'leaves');
                            }
                        }
                    }
                }
            }
        }

        // --- 4. Player Physics & Movement ---
        camera.position.set(0, 5, 0);

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 12; canJump = false; break;
                case 'Digit1': selectSlot(1, 'grass'); break;
                case 'Digit2': selectSlot(2, 'dirt'); break;
                case 'Digit3': selectSlot(3, 'stone'); break;
                case 'Digit4': selectSlot(4, 'wood'); break;
                case 'Digit5': selectSlot(5, 'leaves'); break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // --- 5. Hotbar Selection ---
        let selectedBlock = 'grass';
        const blockTypes = ['grass', 'dirt', 'stone', 'wood', 'leaves'];

        function selectSlot(index, type) {
            selectedBlock = type;
            document.querySelectorAll('.slot').forEach((slot, i) => {
                slot.classList.toggle('active', i === index - 1);
            });
        }

        // --- 6. Raycasting (Mining & Building) ---
        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(Array.from(worldBlocks.values()));

            if (intersects.length > 0 && intersects[0].distance <= 6) {
                const intersect = intersects[0];

                if (e.button === 0) {
                    // Left-Click: Mine Block
                    removeBlock(intersect.object);
                } else if (e.button === 2) {
                    // Right-Click: Place Block
                    const normal = intersect.face.normal;
                    const pos = intersect.object.position.clone().add(normal);
                    addBlock(Math.floor(pos.x), Math.floor(pos.y), Math.floor(pos.z), selectedBlock);
                }
            }
        });

        // Disable right-click menu inside game
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- 7. Main Game Loop ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (controls.isLocked) {
                // Gravity
                velocity.y -= 28.0 * delta;

                // Decay movement
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 120.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 120.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += velocity.y * delta;

                // Floor Collision Check
                if (camera.position.y < 3) {
                    velocity.y = 0;
                    camera.position.y = 3;
                    canJump = true;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
